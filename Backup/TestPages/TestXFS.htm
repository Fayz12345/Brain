<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <title></title>
</head>
<body>







    <table id="Table1" runat="server">
        <tr>
            <td align="center" colspan="4">
                <h1>
                    Device Inventory Distribution MOVE (IFS)</h1>
            </td>
        </tr>
        <tr>
            <td align="left" valign="top" rowspan="3">
                ESN/IMEI List<br />
                <asp:textbox id="txtESN" runat="server" backcolor="#A5EBC5" forecolor="Black" font-size="Larger"
                    maxlength="20" tooltip="ESN List Number."></asp:textbox>
                <asp:button id="btrRecord" runat="server" text="+" width="5%" />
                <br />
                <asp:textbox id="txtCount" runat="server" clientidmode="Static" enabled="False" text="0"
                    tooltip="Count" width="25%"></asp:textbox>
                <asp:button id="btnClear" runat="server" text="Clear" />
                <br />
                <asp:listbox id="lstHistory" runat="server" tooltip="List of ESN/IMEI Numbers for which the Location number is updated."
                    height="100%" width="100%" rows="30"></asp:listbox>
            </td>
            <td align="left" valign="top">
                or
                <br />
                BIN<br />
                <asp:textbox id="lblBinNumber" runat="server" tooltip="Bin Number for which the Location number is updated."></asp:textbox>
            </td>
            <td align="left" valign="top">
                or
                <br />
                Location<br />
                <asp:textbox id="IFSMoveFromLocationOnly" runat="server" tooltip="IFS Location for which the Location number is updated."></asp:textbox>
            </td>
            <td align="left" valign="top">
                <table id="Table4" runat="server">
                    <tr>
                        <td align="right" valign="top">
                            or
                            <br />
                            <br />
                        </td>
                        <td align="left" valign="top">
                        </td>
                    </tr>
                    <tr>
                        <td align="right" valign="top">
                            Site:
                        </td>
                        <td align="left" valign="top">
                            <asp:dropdownlist id="drpMoveIFSSite" runat="server">
                                                </asp:dropdownlist>
                        </td>
                    </tr>
                    <tr>
                        <td align="right" valign="top">
                            Project:
                        </td>
                        <td align="left" valign="top">
                            <asp:dropdownlist id="drpMoveIFSProject" runat="server">
                                                </asp:dropdownlist>
                        </td>
                    </tr>
                    <tr>
                        <td align="right" valign="top">
                            SKU:
                        </td>
                        <td align="left" valign="top">
                            <asp:textbox id="txtFromSku" runat="server" tooltip="IFS Sku." maxlength="25"></asp:textbox>
                        </td>
                    </tr>
                    <tr>
                        <td align="right" valign="top">
                            Location:
                        </td>
                        <td align="left" valign="top">
                            <asp:textbox id="txtFromLocation" runat="server" tooltip="IFS Location." maxlength="20"></asp:textbox>
                        </td>
                    </tr>
                    <tr>
                        <td align="right" valign="top">
                            Condition:
                        </td>
                        <td align="left" valign="top">
                            <asp:dropdownlist id="drpMoveIFSCondition" runat="server">
                                                </asp:dropdownlist>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
        <tr>
            <td align="left" valign="top">
                To IFS Location<br />
                <asp:textbox id="txtLocation" runat="server" backcolor="#A5EBC5" forecolor="Black"
                    font-size="Larger" maxlength="20" tooltip="IFS Location."></asp:textbox>
                <br />
                <asp:button id="btnUpdateLocation" runat="server" text="Update" usesubmitbehavior="False"
                    width="100%" />
            </td>
            <td align="left" valign="top" colspan="2">
                <asp:panel id="Panel3" runat="server" width="100%" height="100%" scrollbars="Auto">
                                    Suggest<br />
                                        <asp:Label ID="Label2" runat="server" Text="ESN/IMEI" AssociatedControlID="tSuggestIMEI"></asp:Label>
                                        <asp:TextBox ID="tSuggestIMEI" runat="server"></asp:TextBox>
                                        <asp:Button ID="btnSearchRefresh" runat="server" Text="Suggest" Width="50%" />
                                        <asp:GridView ID="grdSearchSuggest" runat="server" AutoGenerateColumns="False" CssClass="mGrid"
                                            PagerStyle-CssClass="pgr" AlternatingRowStyle-CssClass="alt">
                                            <SelectedRowStyle CssClass="srowstyle" />
                                            <Columns>
                                                <asp:TemplateField HeaderText="">
                                                    <ItemTemplate>
                                                        <asp:Button ID="btnPick" runat="server" Text="Pick" />
                                                    </ItemTemplate>
                                                </asp:TemplateField>
                                                <asp:BoundField DataField="Freq" HeaderText="Freq" HeaderStyle-HorizontalAlign="Left">
                                                    <ItemStyle HorizontalAlign="left" />
                                                </asp:BoundField>
                                                <asp:BoundField DataField="IFSLocation" HeaderText="Location" HeaderStyle-HorizontalAlign="Left">
                                                    <ItemStyle HorizontalAlign="left" />
                                                </asp:BoundField>
                                                <asp:BoundField DataField="IFSSite" HeaderText="Site" HeaderStyle-HorizontalAlign="Left">
                                                    <ItemStyle HorizontalAlign="left" />
                                                </asp:BoundField>
                                                <asp:BoundField DataField="IFSProject" HeaderText="Project" HeaderStyle-HorizontalAlign="Left">
                                                    <ItemStyle HorizontalAlign="left" />
                                                </asp:BoundField>
                                                <asp:BoundField DataField="SKU" HeaderText="SKU" HeaderStyle-HorizontalAlign="Left">
                                                    <ItemStyle HorizontalAlign="left" />
                                                </asp:BoundField>
                                                <asp:BoundField DataField="IFSCondition" HeaderText="Condition" HeaderStyle-HorizontalAlign="Left">
                                                    <ItemStyle HorizontalAlign="left" />
                                                </asp:BoundField>
                                            </Columns>
                                        </asp:GridView>
                                    </asp:panel>
            </td>
        </tr>
        <tr>
            <td align="left" valign="top" colspan="3">
                <asp:label id="lblMessage" runat="server" text="" height="100%" width="100%"></asp:label>
            </td>
        </tr>
    </table>
</body>
</html>
